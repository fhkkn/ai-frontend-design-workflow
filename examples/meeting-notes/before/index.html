<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>页间 · 会议纪要示例</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="index.html" aria-label="页间首页"><span class="brand-mark" aria-hidden="true">页</span>页间 <span class="brand-caption">会议之后，留下重点。</span></a><span class="demo-label">交互示例 · 数据仅在当前浏览器</span></header>
  <main class="workspace">
    <aside class="sidebar" aria-label="纪要列表">
      <div class="section-label">工作记录 <span id="count"></span></div>
      <div class="list-heading"><h1>会议纪要</h1><button id="new-note" class="add-button" aria-label="新建纪要">＋</button></div>
      <label class="search-label" for="search">查找纪要</label>
      <input id="search" type="search" placeholder="按标题查找…" autocomplete="off">
      <nav id="note-list" aria-label="选择纪要"></nav>
      <p class="local-hint">内容保存在本机浏览器。<br>此演示不上传录音，也不生成转写。</p>
    </aside>
    <section class="editor" aria-labelledby="editor-heading">
      <div class="editor-top"><span class="eyebrow" id="editor-heading">MEETING NOTES / 会议记录</span><span id="save-state">已保存</span></div>
      <label class="field-label" for="title">纪要标题</label>
      <input id="title" class="title-input" maxlength="100">
      <div class="note-meta"><span id="note-date"></span><span>手动编辑</span><span>本地草稿</span></div>
      <div class="document-rule"></div>
      <label class="body-label" for="body">讨论与决定</label>
      <textarea id="body" spellcheck="false"></textarea>
      <footer class="editor-footer"><p id="feedback" role="status" aria-live="polite">示例内容可直接修改。</p><button id="save" class="primary-button">保存纪要</button></footer>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
